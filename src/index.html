<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calendrier de l'Avent des bonnes nouvelles</title>
  <meta name="description" content="Un sapin, 24 cadeaux et une étoile : une bonne nouvelle de 2026 à ouvrir chaque jour de décembre.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="neige" aria-hidden="true"></div>

  <div id="bandeau-dev" class="bandeau-dev" hidden></div>

  <header class="entete">
    <h1>Calendrier de l'Avent<span>des bonnes nouvelles 2026</span></h1>
    <p id="message-jour" class="message-jour"></p>
    <button id="musique" class="bouton-musique" type="button" aria-pressed="false">
      <span aria-hidden="true">🎵</span> <span class="libelle">Musique</span>
    </button>
  </header>

  <ul class="legende" aria-label="Légende">
    <li><span class="pastille" aria-hidden="true">★</span> Cadeau du jour</li>
    <li><span class="pastille" aria-hidden="true">✓</span> Déjà ouvert</li>
    <li><span class="pastille" aria-hidden="true">🔒</span> Pas encore</li>
  </ul>

  <main>
    <section class="sapin" id="sapin" aria-label="Sapin de l'Avent : 24 cadeaux et une étoile"></section>
  </main>

  <p id="annonce" class="annonce" role="status" aria-live="polite"></p>

  <!-- Le Père Noël et ses lutins tirent la bonne nouvelle sur un bandeau -->
  <div id="scene" class="scene" hidden>
    <p class="scene-titre">🔔 Une bonne nouvelle arrive !</p>
    <div class="cortege" id="cortege">
      <span class="corde" aria-hidden="true"></span>
      <svg class="perso pere-noel" viewBox="0 0 60 80" aria-hidden="true">
        <rect x="18" y="66" width="9" height="12" rx="2" fill="#222"/>
        <rect x="31" y="66" width="9" height="12" rx="2" fill="#222"/>
        <ellipse cx="30" cy="50" rx="18" ry="19" fill="#d62828"/>
        <rect x="13" y="63" width="34" height="5" rx="2.5" fill="#fff"/>
        <rect x="12" y="49" width="36" height="6" fill="#222"/>
        <rect x="26" y="48" width="8" height="8" fill="none" stroke="#f5c542" stroke-width="2"/>
        <path d="M43 42 L56 50" stroke="#d62828" stroke-width="7" stroke-linecap="round"/>
        <circle cx="56" cy="50" r="3.5" fill="#222"/>
        <circle cx="28" cy="24" r="10" fill="#f6cfa8"/>
        <path d="M17 25 Q28 48 39 25 Q34 31 28 31 Q22 31 17 25Z" fill="#fff"/>
        <circle cx="21" cy="24" r="2.3" fill="#e8907a"/>
        <circle cx="23" cy="20" r="1.3" fill="#222"/>
        <path d="M16 18 Q26 0 45 6 Q38 10 40 18Z" fill="#d62828"/>
        <circle cx="45" cy="7" r="3.5" fill="#fff"/>
        <rect x="15" y="15" width="27" height="5" rx="2.5" fill="#fff"/>
      </svg>
      <svg class="perso lutin" viewBox="0 0 40 60" aria-hidden="true">
        <rect x="11" y="50" width="7" height="8" rx="2" fill="#7a3b12"/>
        <rect x="22" y="50" width="7" height="8" rx="2" fill="#7a3b12"/>
        <path d="M8 51 L12 28 H28 L32 51Z" fill="#2e9e5b"/>
        <rect x="9" y="41" width="22" height="4" fill="#222"/>
        <path d="M11 28 l3 4 l3 -4 l3 4 l3 -4 l3 4 l3 -4z" fill="#d62828"/>
        <path d="M27 32 L38 37" stroke="#2e9e5b" stroke-width="5" stroke-linecap="round"/>
        <circle cx="19" cy="20" r="8" fill="#f6cfa8"/>
        <path d="M26 19 l7 -4 l-5 7z" fill="#f6cfa8"/>
        <circle cx="15" cy="19" r="1.1" fill="#222"/>
        <circle cx="14" cy="23" r="1.6" fill="#f2a08c"/>
        <path d="M11 15 Q20 -2 36 4 Q28 8 28 15Z" fill="#2e9e5b"/>
        <circle cx="36" cy="4" r="2.5" fill="#d62828"/>
        <rect x="10" y="12" width="19" height="4" rx="2" fill="#d62828"/>
      </svg>
      <svg class="perso lutin lutin-2" viewBox="0 0 40 60" aria-hidden="true">
        <rect x="11" y="50" width="7" height="8" rx="2" fill="#7a3b12"/>
        <rect x="22" y="50" width="7" height="8" rx="2" fill="#7a3b12"/>
        <path d="M8 51 L12 28 H28 L32 51Z" fill="#d62828"/>
        <rect x="9" y="41" width="22" height="4" fill="#222"/>
        <path d="M11 28 l3 4 l3 -4 l3 4 l3 -4 l3 4 l3 -4z" fill="#2e9e5b"/>
        <path d="M27 32 L38 37" stroke="#d62828" stroke-width="5" stroke-linecap="round"/>
        <circle cx="19" cy="20" r="8" fill="#e9b98f"/>
        <path d="M26 19 l7 -4 l-5 7z" fill="#e9b98f"/>
        <circle cx="15" cy="19" r="1.1" fill="#222"/>
        <circle cx="14" cy="23" r="1.6" fill="#f2a08c"/>
        <path d="M11 15 Q20 -2 36 4 Q28 8 28 15Z" fill="#d62828"/>
        <circle cx="36" cy="4" r="2.5" fill="#fff"/>
        <rect x="10" y="12" width="19" height="4" rx="2" fill="#2e9e5b"/>
      </svg>
      <div class="bandeau-nouvelle"><span id="bandeau-texte"></span></div>
    </div>
    <p class="scene-passer">Touchez l'écran pour passer</p>
  </div>

  <dialog id="fenetre" class="fenetre" aria-labelledby="fenetre-titre">
    <div class="fenetre-contenu">
      <p class="fenetre-jour" id="fenetre-jour"></p>
      <p class="fenetre-emoji" id="fenetre-emoji" aria-hidden="true"></p>
      <h2 id="fenetre-titre"></h2>
      <div id="fenetre-image"></div>
      <p id="fenetre-texte"></p>
      <p id="fenetre-voeux" class="fenetre-voeux" hidden></p>
      <button type="button" class="fermer" id="fermer">Refermer le cadeau</button>
    </div>
  </dialog>

  <footer class="pied">Un cadeau s'ouvre chaque jour à minuit, heure de Paris.</footer>

  <script type="application/json" id="donnees">__DONNEES__</script>
  <script src="app.js"></script>
</body>
</html>
